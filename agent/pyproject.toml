[project]
name = "landed-agent"
version = "0.1.0"
description = "Landed voice agent: whitelisted templates, tiering policy, Gemini template choice and TTS (simulation only)."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "google-genai>=1.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["landed_agent"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
