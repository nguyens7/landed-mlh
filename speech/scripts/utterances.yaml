# Ground-truth bank of pilot transmissions for Landed (all fictional / simulated).
# `text` is the exact words sent to TTS. Truth follows speech/models.py ParsedTransmission.
# callsign.normalized = alphanumerics as spoken (N-prefix only if "November" was said);
# callsign.snapped_to = the roster registration the pilot actually is; ambiguous = a correct
# parser must flag a near-tie (scenario S4). Null/missing slots mean "not stated".
# style: normal | urgent (TTS delivery instruction) ; partial = deliberately truncated call.

# ---------------------------------------------------------------- S1: clean autonomous
- id: s1_01
  scenario: S1
  text: "Landed desk, MEDEVAC Two Six Four Six X-Ray, Downtown Skyport, lifting, East River northbound, five hundred, landing East 34th."
  callsign: {normalized: "2646X", snapped_to: N2646X}
  intent: checkin
  slots: {position: Downtown Skyport, origin: Downtown Skyport, destination: East 34th, corridor: East River, direction: northbound, altitude_ft: 500}
- id: s1_02
  scenario: S1
  text: "Landed desk, MEDEVAC Two Six Four Six X-Ray, abeam Brooklyn Bridge, five hundred."
