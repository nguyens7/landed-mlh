[project]
name = "landed-speech"
version = "0.1.0"
description = "Landed track C: radio transcription, callsign snapping and transmission parsing"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.29.0",
    "jiwer>=4.0.0",
    "numpy>=2.0.0",
    "openai>=2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "scipy>=1.14.0",
    "soundfile>=0.13.0",
]

[dependency-groups]
dev = ["pytest>=9.0.0", "ruff>=0.17.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]
